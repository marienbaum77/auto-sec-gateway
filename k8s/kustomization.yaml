apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ingress-nginx-standalone.yaml
  - issuer.yaml
  - ingress.yaml
  - hysteria.yaml
  - manager.yaml
  - manager-rbac.yaml
  - postgres.yaml
  - manager-config.yaml
  - secrets.yaml

configMapGenerator:
  - name: hysteria-template-cm
    namespace: prod
    files:
      - config.yaml=hysteria-config.template.yaml